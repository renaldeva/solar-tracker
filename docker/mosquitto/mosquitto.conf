# Eclipse Mosquitto Configuration for Solar Tracker Industrial Pilot

# Local development listener (unencrypted on 1883; production must use TLS on 8883)
listener 1883 0.0.0.0

# Security: Disable anonymous access
allow_anonymous false

# Password and ACL configuration
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
