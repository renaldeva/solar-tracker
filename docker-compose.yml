services:
  # Web Server (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: solar_tracker_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - solar_network

  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: solar_tracker_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-SolarTracker}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-Dev@211104}
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_AUTH_USERNAME=${MQTT_AUTH_USERNAME:-solar_backend}
      - MQTT_AUTH_PASSWORD=${MQTT_AUTH_PASSWORD:-BackendSecret123!}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - solar_network

  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: solar_tracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-SolarTracker}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Dev@211104}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-SolarTracker}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - solar_network

  # Eclipse Mosquitto 2 MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: solar_tracker_mosquitto
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/passwd:/mosquitto/config/passwd
      - ./docker/mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto_data:/mosquitto/data
    ports:
      - "127.0.0.1:${FORWARD_MQTT_PORT:-1883}:1883"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "1883"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - solar_network

  # MQTT Background Listener
  mqtt-listener:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: solar_tracker_mqtt_listener
    restart: unless-stopped
    command: php artisan mqtt:listen
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-SolarTracker}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-Dev@211104}
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_AUTH_USERNAME=${MQTT_AUTH_USERNAME:-solar_backend}
      - MQTT_AUTH_PASSWORD=${MQTT_AUTH_PASSWORD:-BackendSecret123!}
    depends_on:
      app:
        condition: service_started
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - solar_network

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: solar_tracker_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-SolarTracker}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - solar_network

  # Laravel Scheduler Worker
  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: solar_tracker_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-SolarTracker}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-Dev@211104}
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - solar_network

  # Node.js for Vite Development (Profile: dev)
  node:
    image: node:22-alpine
    container_name: solar_tracker_vite
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - dev
    networks:
      - solar_network

volumes:
  postgres_data:
    name: solar_tracker_postgres_data
  mosquitto_data:
    name: solar_tracker_mosquitto_data

networks:
  solar_network:
    name: solar_tracker_network
    driver: bridge
